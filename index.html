<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My progress</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="outer">
    <section class="plan">
      <div class="plan-title">
        <span class="badge">My progress</span>
        <span class="subtitle">Progress tracker</span>
      </div>

      <div class="analytics" id="analyticsBar"></div>

      <div class="week-header">
        <div class="left-stack">
          <div class="chev">
            <button class="nav-btn" id="prevWeek" aria-label="Previous week">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 6l-6 6 6 6"/>
              </svg>
            </button>
            <button class="nav-btn" id="nextWeek" aria-label="Next week">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
          <div class="week-pill" id="weekRange">Week</div>
        </div>

        <div class="tools">
          <div class="date-wrap">
            <span class="date-hint">today</span>
            <input class="input" type="date" id="datePicker" />
          </div>
        </div>
      </div>



      <div class="week-grid" id="weekGrid" aria-live="polite"></div>


    <div class="legend">
      <span class="pill"></span>
      <span class="pill"></span>
      <span class="pill"></span>
      <span class="pill"></span>
      <span class="pill"></span>
    </div>


      

    </section>

    <div class="details">
        <!-- Card 1: Task -->
        <article class="card">
          <h4 id="tasksTitle">Tasks ·</h4>
          <div class="task-list" id="taskList"></div>
        </article>

        <!-- Card 2: Other notes -->
        <article class="card">

          <!-- Optional compact deadline mini can live here -->
          <div class="deadline-mini" id="deadlineDisplay">
            <div class="deadline-mini-head">
              <span class="spark">✨</span>
              <span class="label">Deadline</span>
            </div>
            <div class="deadline-mini-big" id="deadlineCountdown" data-deadline-open>No deadline set</div>
            <div class="deadline-mini-sub" id="deadlineMsg" data-deadline-open>Click to choose a date</div>
            <textarea class="deadline-note-box" id="deadlineNoteBox" placeholder="Notes"></textarea>
          </div>

          
        </article>

        <!-- Card 3: Month (heatmap) -->
        <article class="card" id="monthCard">
          <h4>Month</h4>
          <!-- <div class="mg-legend">
            <span class="swatch done"></span> Completed · <span class="swatch empty"></span> No plan
          </div> -->
          <div class="month-head" aria-hidden="true">
            <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div>
            <div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div>
          </div>
          <div id="monthHeatmap" class="month-heatmap" role="grid" aria-label="Two-month completion heatmap"></div>
        </article>

      </div>
  </div>

  <!-- Notes modal -->
  <div class="modal-back" id="notesBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notesTitle">
      <h3 id="notesTitle">Day editor</h3>

      <h3 id="q">Quick note</h3>
      <textarea id="notesText" placeholder="Write a short note for this day"></textarea>
      <div class="row">
        <button class="btn ghost" id="notesCancel">Close</button>
        <button class="btn primary" id="notesSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Deadline modal (opened from mini only) -->
  <div class="modal-back" id="deadlineBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deadlineTitle">
      <h3 id="deadlineTitle">Set Deadline</h3>
      <div class="grid">
        <label for="deadlinePicker">Deadline date</label>
        <input id="deadlinePicker" type="date" />
      </div>
      <div class="row">
        <button class="btn ghost" id="deadlineCancel">Cancel</button>
        <button class="btn primary" id="deadlineSave">Save</button>
        <button class="btn ghost" id="deadlineRemove">Clear</button>
      </div>
      <p class="small">The dashboard shows only the remaining days; settings live here.</p>
    </div>
  </div>

  

  <script src="script.js"></script>
</body>
</html>
